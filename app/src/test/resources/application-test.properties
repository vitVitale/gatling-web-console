# Test configuration for integration tests
server.port=0
spring.main.web-application-type=servlet

# Test directories
app.simulation.directory=test-simulations
app.results.directory=test-results
app.workspace.directory=test-workspace
gatling.jars.dir=./test-simulations
gatling.tests.dir=./test-workspace
gatling.results.dir=./test-results

# Security configuration for tests
api.security.username=testuser
api.security.password=testpass

# Disable file scanning during tests
app.file-scanner.interval=999999

# Logging configuration
logging.level.org.testing.pt.gatling=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Disable actuator endpoints for tests
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true