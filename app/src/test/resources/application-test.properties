# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable actual file scanning during tests
app.file-scanner.interval=999999999

# Test directories
gatling.jars.dir=./test-simulations
gatling.tests.dir=./test-gatling-tests
gatling.results.dir=./test-gatling-results

# Security
api.security.username=testuser
api.security.password=testpass

# History retention
app.history.retention-days=30
