# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Configuration
spring.application.name=gatling-web-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Gatling Configuration
gatling.jars.dir=./simulations
gatling.tests.dir=./gatling-tests
gatling.results.dir=./gatling-results

# File Scanning Configuration
app.simulation.directory=simulations
app.results.directory=gatling-results
app.workspace.directory=gatling-tests
app.file-scanner.interval=20000

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Security Configuration
api.security.username=admin
api.security.password=password

# Logging Configuration
logging.level.org.testing.pt.gatling=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Database Configuration (SQLite)
spring.datasource.url=jdbc:sqlite:./data/gatling-console.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Debug Configuration
debug=false