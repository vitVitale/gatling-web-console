# Development Profile Configuration
spring.profiles.active=dev

# Server Configuration
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Logging Configuration
logging.level.org.testing.pt.gatling=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Database Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gatling Directories
gatling.jars.dir=./simulations
gatling.tests.dir=./gatling-tests
gatling.results.dir=./gatling-results

# File Scanning
app.file-scanner.interval=5000

# Security (dev defaults)
api.security.username=admin
api.security.password=password

# History Retention
app.history.retention-days=30

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
