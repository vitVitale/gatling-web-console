<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Gatling Web Console'">Gatling Web Console</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    
    <!-- Custom CSS -->
    <style>
        :root {
            --bg-color: #f5f7fa;
            --text-color: #1a202c;
            --sidebar-bg: #ffffff;
            --sidebar-border: rgba(0, 0, 0, .08);
            --nav-link-color: #4a5568;
            --nav-link-hover: #2d3748;
            --nav-link-active: #3182ce;
            --navbar-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0f1419;
            --text-color: #e2e8f0;
            --sidebar-bg: #1a202c;
            --sidebar-border: rgba(255, 255, 255, .08);
            --nav-link-color: #a0aec0;
            --nav-link-hover: #cbd5e0;
            --nav-link-active: #63b3ed;
            --navbar-bg: #1a202c;
            --card-bg: #1a202c;
            --card-border: #2d3748;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px 0 rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 80px 0 0;
            box-shadow: var(--shadow-md);
            width: 240px;
            background-color: var(--sidebar-bg) !important;
            transition: background-color 0.3s ease;
            border-right: 1px solid var(--sidebar-border);
        }

        .sidebar-sticky {
            position: relative;
            top: 0;
            height: calc(100vh - 80px);
            padding: 1rem 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .nav-link {
            font-weight: 500;
            color: var(--nav-link-color) !important;
            transition: all 0.2s ease;
            padding: 0.75rem 1.5rem !important;
            border-radius: 0.5rem;
            margin: 0.25rem 1rem;
            display: flex;
            align-items: center;
        }

        .nav-link:hover {
            background-color: rgba(49, 130, 206, 0.1);
            color: var(--nav-link-hover) !important;
            transform: translateX(4px);
        }

        .nav-link.active {
            color: var(--nav-link-active) !important;
            background-color: rgba(49, 130, 206, 0.1);
            font-weight: 600;
            border-left: 3px solid var(--nav-link-active);
            margin-left: calc(1rem - 3px);
        }

        .main-content {
            padding-top: 80px;
            margin-left: 240px;
            padding-left: 2rem;
            padding-right: 2rem;
        }

        .navbar {
            background-color: var(--navbar-bg) !important;
            transition: background-color 0.3s ease;
            border-bottom: 1px solid var(--sidebar-border);
            box-shadow: var(--shadow-sm);
            height: 64px;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.025em;
            color: #ffffff !important;
            background: linear-gradient(135deg, #ff6200 0%, #ff7d33 100%);
            padding: 0.5rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .navbar-brand:hover {
            background: linear-gradient(135deg, #ff7d33 0%, #ff9052 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 98, 0, 0.3);
        }

        [data-theme="dark"] .navbar-brand {
            color: #ffffff !important;
        }

        [data-theme="light"] .navbar-brand {
            color: #ffffff !important;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .card-header {
            border-bottom: 1px solid var(--card-border);
            font-weight: 600;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem 0.75rem 0 0 !important;
        }

        .card-body {
            padding: 1.5rem;
        }

        .theme-toggle {
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.25rem;
            padding: 0.5rem;
            margin-left: auto;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        [data-theme="dark"] .theme-toggle {
            color: var(--text-color);
        }

        [data-theme="light"] .theme-toggle {
            color: var(--text-color);
        }

        .theme-toggle:hover {
            background-color: rgba(128, 128, 128, 0.1);
            transform: scale(1.1);
        }

        /* Buttons with modern styling */
        .btn {
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 0.625rem 1.25rem;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border: none;
        }

        /* Form controls */
        .form-control,
        .form-select {
            border-radius: 0.5rem;
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
            border-color: var(--nav-link-active);
        }

        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select {
            background-color: #2d3748;
            border-color: #4a5568;
            color: var(--text-color);
        }

        [data-theme="dark"] .form-control:focus,
        [data-theme="dark"] .form-select:focus {
            background-color: #2d3748;
            border-color: var(--nav-link-active);
            color: var(--text-color);
        }

        [data-theme="dark"] .form-control::placeholder {
            color: #718096;
        }

        /* Form labels and text */
        .form-label {
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        [data-theme="dark"] .form-label,
        [data-theme="dark"] .form-text {
            color: var(--text-color);
        }

        /* Tables */
        .table {
            border-collapse: separate;
            border-spacing: 0;
        }

        .table thead th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1rem;
            border-bottom: 2px solid var(--card-border);
        }

        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
        }

        .table tbody tr {
            transition: background-color 0.15s ease;
        }

        .table tbody tr:hover {
            background-color: rgba(49, 130, 206, 0.05);
        }

        [data-theme="dark"] .table {
            color: var(--text-color);
            border-color: #4a5568;
            --bs-table-bg: transparent;
            --bs-table-striped-bg: rgba(255, 255, 255, 0.03);
            --bs-table-hover-bg: rgba(255, 255, 255, 0.05);
        }

        [data-theme="dark"] .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(255, 255, 255, 0.03);
        }

        [data-theme="dark"] .table thead th {
            border-color: #4a5568;
            color: var(--text-color);
            background-color: transparent;
        }

        [data-theme="dark"] .table tbody td {
            border-color: #4a5568;
            color: var(--text-color);
        }

        [data-theme="dark"] .table tbody tr {
            background-color: transparent;
        }

        [data-theme="dark"] .table tbody th {
            color: var(--text-color);
        }

        [data-theme="dark"] .table-responsive {
            color: var(--text-color);
        }

        [data-theme="dark"] .text-center {
            color: var(--text-color);
        }

        /* Buttons */
        [data-theme="dark"] .btn-outline-secondary {
            color: #adb5bd;
            border-color: #6c757d;
        }

        [data-theme="dark"] .btn-outline-secondary:hover {
            background-color: #6c757d;
            border-color: #6c757d;
            color: #fff;
        }

        [data-theme="dark"] .btn-outline-primary {
            color: #0d6efd;
            border-color: #0d6efd;
        }

        [data-theme="dark"] .btn-outline-primary:hover {
            background-color: #0d6efd;
            border-color: #0d6efd;
            color: #fff;
        }

        [data-theme="dark"] .btn-outline-danger {
            color: #dc3545;
            border-color: #dc3545;
        }

        /* Card headers */
        [data-theme="dark"] .card-header {
            background-color: #343a40;
            border-color: #495057;
            color: var(--text-color);
        }

        /* Border utilities */
        [data-theme="dark"] .border-bottom {
            border-color: #495057 !important;
        }

        /* Text colors */
        [data-theme="dark"] h1,
        [data-theme="dark"] h2,
        [data-theme="dark"] h3,
        [data-theme="dark"] h4,
        [data-theme="dark"] h5,
        [data-theme="dark"] h6,
        [data-theme="dark"] p,
        [data-theme="dark"] li,
        [data-theme="dark"] .card-title,
        [data-theme="dark"] .card-text {
            color: var(--text-color);
        }

        /* Badges with modern styling */
        .badge {
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 0.025em;
        }

        [data-theme="dark"] .badge {
            color: #fff;
        }

        /* Page header styling */
        .border-bottom {
            border-bottom: 1px solid var(--card-border) !important;
            padding-bottom: 1rem !important;
            margin-bottom: 1.5rem !important;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        /* Alert styling */
        .alert {
            border-radius: 0.5rem;
            border: none;
            padding: 1rem 1.25rem;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }

            .main-content {
                margin-left: 200px;
            }

            .nav-link {
                padding: 0.5rem 1rem !important;
                margin: 0.25rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Gatling Web Console</a>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${requestURI == '/dashboard' ? 'active' : ''}" href="/">
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${requestURI == '/run-test' ? 'active' : ''}" href="/run-test">
                                Run Test
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${requestURI == '/results' ? 'active' : ''}" href="/results">
                                Results
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            
            <!-- Main content -->
            <main role="main" class="col-md-10 ml-sm-auto px-4 main-content">
                <div th:replace="${content}">
                    <!-- Content will be replaced by the page content -->
                </div>
            </main>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>

    <!-- Theme Toggle Script -->
    <script>
        // Initialize theme from localStorage or default to light
        const initTheme = () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        };

        // Update the theme icon based on current theme
        const updateThemeIcon = (theme) => {
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
        };

        // Toggle theme
        const toggleTheme = () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        };

        // Initialize theme on page load
        initTheme();

        // Add event listener to toggle button
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('themeToggle');
            if (toggleButton) {
                toggleButton.addEventListener('click', toggleTheme);
            }
        });
    </script>
</body>
</html>
