# Production Profile Configuration
spring.profiles.active=prod

# Server Configuration
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=true

# Logging Configuration
logging.level.org.testing.pt.gatling=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN

# Database Configuration
spring.jpa.show-sql=false

# Gatling Directories
gatling.jars.dir=./simulations
gatling.tests.dir=./gatling-tests
gatling.results.dir=./gatling-results

# File Scanning
app.file-scanner.interval=20000

# Security (use environment variables in production)
api.security.username=${API_USERNAME:admin}
api.security.password=${API_PASSWORD:changeme}

# History Retention
app.history.retention-days=30

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
server.error.include-stacktrace=never
