version: '3.8'

services:
  gatling-console:
    build: .
    ports:
      - "8080:8080"
    environment:
      - API_USERNAME=${API_USERNAME:-admin}
      - API_PASSWORD=${API_PASSWORD:-changeme}
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./simulations:/app/simulations
      - ./gatling-results:/app/gatling-results
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider=off", "--server-response-timeout=30", "http://localhost:8080/actuator/health", "||", "exit", "1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
